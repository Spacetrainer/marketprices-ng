name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # Pure file checks — bash, awk and grep over the working tree. No database,
      # no secrets, no node_modules. They run BEFORE install so a P0.1 or P12.3
      # violation fails in seconds instead of after a cold dependency install.
      #
      # Invoked as `bash scripts/...`, NOT `pnpm check:...`, and that is load
      # bearing: pnpm auto-installs before `pnpm run` when node_modules is
      # absent, which on a fresh runner both erases the speed argument above and
      # performs an install that does not carry --frozen-lockfile. Same command
      # either way; only this form keeps that flag meaningful.
      - name: Seed audit (P0.1)
        run: bash scripts/check-seed.sh

      - name: Vocabulary audit (P12.3)
        run: bash scripts/check-vocab.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cheapest check that needs node_modules, and the only mechanical guard on
      # P0.2/P6.1/P10.6 — a hardcoded figure makes the suites below moot.
      - name: Lint (P0.2, P6.1, P10.6)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Admin route inventory (P12.1)
        run: pnpm check:routes

      - name: Install Playwright browsers (with OS deps)
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e
        # The /admin middleware reads these at request time; without them every guarded
        # route 500s instead of redirecting and the P12.5 boundary tests fail. The
        # publishable key is public by design (P9.3) — it is a secret here only for tidiness.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
